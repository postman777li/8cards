services:
  - type: web
    name: 8cards-preview
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false
      - key: SHUTDOWN_TIMEOUT_MS
        value: '25000'
